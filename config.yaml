# config.yaml — single source of run configuration for the pipeline.
# Loaded by scripts/run.py via indic_synth.common.config.load_config.
# Each stage reads its own subsection (cfg.stage("<name>")); 
# the global seed and out_dir below are injected into every subsection as defaults.

# ---- global ----
seed: 1234
out_dir: out

# ---- §4.2 data acquisition (Kathbath voice bank) ----
# Target: 2 languages x 10 speakers = 20 distinct speakers, gender-balanced.
data_acquisition:
  source: hf                       # "hf" (gated, needs HF_TOKEN) or "local" (fake_kathbath)
  repo_id: ai4bharat/Kathbath
  local_dir: fake_kathbath
  languages: [hindi, malayalam, tamil]    # Kathbath folder names (verify against the real HF layout)
  split: valid                     # ~30x smaller than train; plenty for a voice bank
  speakers_per_language: 7
  clips_per_speaker: 4
  min_total_speakers: 20
  gender_balance: true
  ref_min_dur: 3.0
  ref_max_dur: 15.0
  max_retries: 4
  retry_backoff: 2.0
  force_catalog: false

# ---- §4.3 reference-audio engineering ----
audio_engineering:
  target_sr: 24000                 # matches IndicF5 / F5-TTS front-end
  norm: peak                       # peak | rms | lufs
  peak_dbfs: -1.0
  rms_dbfs: -20.0
  trim: false
  max_ref_sec: 15.0
  subtype: PCM_16

# ---- §4.4 synthetic sentence generation (Gemma-3-12b-it 4-bit) ----
sentence_generation:
  model_id: google/gemma-3-12b-it
  load_in_4bit: true
  languages:                       # code -> [display name, script in SCRIPT_RANGES]
    hi: [Hindi, Devanagari]
    ml: [Malayalam, Malayalam]
  topics:
    - Daily Commute
    - Local Cuisine
    - Tech Troubleshooting
    - Weather Reports
    - Health and Wellness
    - Shopping and Markets
    - Festivals and Culture
    - Travel and Tourism
    - Education and School
    - Banking and Money
  sentence_types: [declarative, interrogative, imperative, exclamatory]
  per_cell_quota: 13               # 2 langs x 10 topics x 4 types x 13 ~= 1040 sentences
  sentences_per_call: 12
  max_attempts_per_cell: 8
  temperature: 0.9
  top_p: 0.95
  max_new_tokens: 512
  min_words: 3
  max_words: 20
  script_min_ratio: 0.90
  min_type_token_ratio: 0.55
  near_dup_threshold: 0.92
  langid_backend: fasttext
  langid_min_conf: 0.50
  embed_model_id: sentence-transformers/LaBSE

# ---- §4.5 TTS generation (IndicF5 voice cloning) ----
tts_generation:
  model_id: ai4bharat/IndicF5
  target_sr: 24000
  max_chars: 300                   # chunk longer text at sentence boundaries
  device: cuda
  lang_map:                        # sentence code -> reference-manifest language name
    hi: hindi
    ml: malayalam

# ---- §4.6 quality control (3 gates) ----
quality_control:
  asr_model_id: ai4bharat/indic-conformer-600m-multilingual
  asr_sr: 16000
  asr_decoding: ctc
  spk_model_id: speechbrain/spkrec-ecapa-voxceleb
  device: cuda
  cer_max: 0.15
  spk_cos_min: 0.60
  dur_per_char_min: 0.04
  dur_per_char_max: 0.30
